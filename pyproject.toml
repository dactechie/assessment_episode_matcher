[build-system]
requires = ["setuptools>=61.0,<69.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assessment_episode_matcher"
dynamic = ["version"]
description = "Assessment Episode Matcher"
readme = "README.md"
authors = [
    {name = "Aftab Jalal", email = "mj@auditlytics.nz"}
]
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-dotenv==1.0.1",
    "pandas==2.2.2",
    "pyarrow==16.1.0",
    "azure_data_tables==12.5.0",
    "azure_storage_blob==12.20.0",
    "rapidfuzz==3.9.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["assessment_episode_matcher*"]

[tool.setuptools.package-data]
assessment_episode_matcher = ["*.md", "*.txt", "*.csv"]

[tool.setuptools.dynamic]
version = {attr = "assessment_episode_matcher.version.__version__"}
